<style>

    white-space: nowrap;
}
.rainbow-char {
    display: inline-block;
    overflow: hidden;

}

    display: inline-block;
    transition: color 0.2s ease;
}
.rainbow-rolling {
    animation: rainbow-roll 0.4s cubic-bezier(0.4, 0.0, 0.2, 1);
}
@keyframes rainbow-roll {
    50% { transform: translateY(-100%); }
}

    width: 100%;

    margin: 1.5rem 0 0.5rem;
    border: 1px solid #333;
    background: #000;
}
.game-embed iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}
.game-embed-actions {
    display: flex;
    gap: 1rem;
    align-items: baseline;
    font-size: 0.85rem;
}
.game-embed-actions span {
    color: #777;
}
.game-fullscreen {
    background: none;
    border: 0;
    padding: 0;
    color: var(--tui-cursor);
    font: inherit;
    cursor: pointer;
}
